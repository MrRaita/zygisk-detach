name: build-test-zip
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ndk-build
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          cd zygisk && "$NDK/ndk-build" -j"$(nproc)" NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/detach.mk NDK_APPLICATION_MK=jni/app.mk
      - name: package (base = released v1.24.0 zip committed at repo root)
        run: |
          mkdir out && cd out
          unzip -q ../zygisk-detach-v1_24_0.zip
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            cp "../zygisk/libs/$abi/libzygisk-detach.so" "zygisk/$abi.so"
          done
          sed -i -e 's/^version=.*/version=v1.24.0-a16clean/' -e '/^updateJson=/d' module.prop
          zip -qr ../zygisk-detach-a16-clean.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: zygisk-detach-a16-clean
          path: zygisk-detach-a16-clean.zip
